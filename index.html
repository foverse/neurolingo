<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Practice English with short, spaced-repetition exercises.">
  <title>NeuroLingo — English practice</title><link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="site-header"><div class="header-inner"><a class="brand" href="."><img class="brand-symbol" src="assets/neurolingo-logo.svg" alt=""> NeuroLingo</a><span class="header-note">English practice</span><a class="github" href="https://github.com/foverse/neurolingo">GitHub</a></div></header>
  <main class="workspace">
    <div class="page-heading"><div><p class="kicker">Your practice</p><h1>Let’s work on your English.</h1><p>Read the prompt, think of your answer, then check it.</p></div><div class="review-count"><strong id="reviewed">0</strong><span>cards reviewed</span></div></div>
    <div class="toolbar"><label for="category-select">Topic <select id="category-select"></select></label><div class="position"><span id="card-counter"></span><div class="progress-track"><div id="progress-bar"></div></div></div></div>
    <section class="study-card" aria-label="Practice card">
      <div class="card-top"><span id="card-category"></span><span id="card-type"></span></div>
      <div class="card-content"><p class="prompt-label">Complete the sentence</p><h2 id="card-front"></h2><div id="answer" class="answer" hidden><span>Answer</span><p id="card-back"></p><p id="card-explanation"></p></div><button id="btn-flip" class="primary">Show answer</button></div>
      <div class="card-bottom"><button id="btn-speak" class="text-button"><span aria-hidden="true">◖))</span> Listen</button><span class="keyboard-hint">Space to reveal</span></div>
    </section>
    <div id="rating-controls" class="ratings" hidden><span>How did you do?</span><div><button class="btn-rate" data-grade="1">Again</button><button class="btn-rate" data-grade="2">Hard</button><button class="btn-rate" data-grade="3">Good</button><button class="btn-rate" data-grade="4">Easy</button></div></div>
    <nav class="card-navigation" aria-label="Card navigation"><button id="btn-prev">Previous</button><span>Take your time</span><button id="btn-next">Next</button></nav>
    <p class="privacy-note">Your progress is saved in this browser. <a href="data/english_starter_cards.tsv" download>Download the English deck</a></p>
  </main>
  <script src="js/english-cards.js"></script><script src="js/srs-engine.js"></script><script src="js/app.js"></script>
</body>
</html>
